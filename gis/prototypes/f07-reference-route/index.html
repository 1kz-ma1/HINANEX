<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>HINANEX F07｜合成参考経路 ローカル試作</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./route-model.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">HINANEX / F07 / LOCAL ONLY</div>
      <h1>参考経路の操作試作</h1>
      <p class="warning" role="note"><strong>常時表示：架空地点・合成デモ</strong> — 実際の施設、住所、座標、道路、避難経路ではありません。安全性・災害時の通行可能性を保証しません。</p>
    </header>
    <div class="layout">
      <section class="panel" aria-labelledby="controls-title">
        <h2 id="controls-title">地点と表示条件</h2>
        <p>出発点・目的地をそれぞれ選択すると、模式線を生成できます。</p>
        <label for="origin">架空の出発点</label>
        <select id="origin"></select>
        <label for="destination">架空の目的地</label>
        <select id="destination"></select>
        <label for="condition">表示条件（実移動手段ではありません）</label>
        <select id="condition"></select>
        <label class="check"><input type="checkbox" id="simulateFailure"> 経路生成失敗を合成する</label>
        <div class="actions">
          <button id="generate" type="button">模式経路を表示</button>
          <button id="clear" type="button" class="secondary">表示を解除</button>
          <button id="compare" type="button" class="secondary" aria-pressed="false" aria-controls="diagram" disabled>2案の形を比較</button>
          <button id="reset" type="button" class="secondary">選択からやり直す</button>
        </div>
        <p id="selectionSummary" class="selection-summary" aria-label="現在の架空選択内容"></p>
        <div class="feedback" role="status" aria-live="polite" aria-atomic="true">
          <p id="status" class="status"></p>
          <p id="nextAction" class="next-action"></p>
        </div>
      </section>
      <section class="panel diagram-panel" aria-labelledby="diagram-title">
        <h2 id="diagram-title">経路の模式図</h2>
        <svg id="diagram" viewBox="0 0 640 380" role="img" aria-label="架空の地点を示す模式図。経路はありません。">
          <title>実在の地図ではない模式図</title>
          <rect x="0" y="0" width="640" height="380" rx="16" class="ground" />
          <path d="M160 30 V350 M320 30 V350 M480 30 V350 M35 190 H605" class="guide" />
          <polyline id="routeLine" points="" class="route" hidden="hidden" />
          <polyline id="routeLineAlternative" points="" class="route-alternative" hidden="hidden" />
          <g id="start-a" class="marker"><circle cx="84" cy="90" r="13"/><text x="106" y="84">出発 A</text></g>
          <g id="start-b" class="marker"><circle cx="84" cy="290" r="13"/><text x="106" y="284">出発 B</text></g>
          <g id="goal-x" class="marker goal"><circle cx="550" cy="90" r="13"/><text x="465" y="74">目的地 X</text></g>
          <g id="goal-y" class="marker goal"><circle cx="550" cy="290" r="13"/><text x="465" y="274">目的地 Y</text></g>
        </svg>
        <p id="comparisonNote" class="comparison-note" hidden></p>
        <p class="footnote">SVG内の数値は図形配置用の画面単位であり、緯度経度や距離ではありません。外部地図・GPS・経路APIは使用しません。</p>
      </section>
    </div>
    <footer>NO-GO：本試作から実施設への案内はできません。実経路公開は Issue #358 により保留中です。</footer>
  </main>
</body>
</html>
