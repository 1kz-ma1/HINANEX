name: test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src *.py

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify committed JSON Schema is in sync
        shell: bash
        run: |
          cp contracts/region_export.schema.json /tmp/region_export.schema.json
          python generate_contract_schema.py
          diff -u /tmp/region_export.schema.json contracts/region_export.schema.json
