<style>
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:#f1f5f7;color:#172d39;font:16px/1.6 system-ui,sans-serif;overflow-wrap:anywhere}
main{max-width:1000px;margin:auto;padding:16px}
h1{font-size:clamp(1.45rem,4vw,2rem);line-height:1.35}h2{font-size:1.3rem}h3{margin-top:0;font-size:1.1rem}
.notice{border:2px solid #a56621;background:#fff5e5;border-radius:12px;padding:12px;color:#593607}
nav ol{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}nav li{padding:5px 10px;border:1px solid #8797a3;border-radius:8px}
nav li[aria-current=step]{background:#184b60;color:white}
.panel,article{background:white;border:1px solid #a6b6c1;border-radius:12px;padding:14px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;min-height:44px;max-width:100%;white-space:normal;border:1px solid #184b60;border-radius:8px;padding:8px 12px;background:white;color:#183f52;cursor:pointer}

button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #a14a00;outline-offset:3px}
dt{font-weight:650}dd{margin:0 0 8px}ul{padding-inline-start:24px}
#status{min-height:1.6em} .muted{color:#3f5965}
