name: Historical Edogawa 2019 official-original capture (UNREVIEWED)

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/historical-edogawa-original-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Fetch and byte-check historical original source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline A regression (no network)
        shell: bash
        run: python -m unittest discover -s data-research/tests -p "test_archive_historical_edogawa.py" -v

      - name: Collect five official original responses without committing raw
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_historical_edogawa.py \
            --ledger data-research/scenarios/2019-typhoon19-edogawa-source-candidates.json \
            --out-dir "$RUNNER_TEMP/hinanex-historical-UNREVIEWED"

      - name: Re-read original bytes and verify manifest
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_historical_edogawa.py \
            --ledger data-research/scenarios/2019-typhoon19-edogawa-source-candidates.json \
            --verify-dir "$RUNNER_TEMP/hinanex-historical-UNREVIEWED"

      - name: Upload limited-retention raw and manifest, NEVER commit
        if: ${{ always() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-2019-originals-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-historical-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Human-review status summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 2019江戸川区 Historical Replay 原本候補"
            echo "A capture: ${{ steps.capture.outcome }}"
            echo "A SHA verification: ${{ steps.verify.outcome }}"
            echo "Originals: private 7-day GitHub Actions artifact, never committed."
            echo "**A original-byte capture is NOT independent C acceptance.**"
            echo "**2019 as-of availability approval: 0 / Facility identity approved: 0 / Prediction accuracy: not evaluated.**"
            echo "The currently served original document may have been updated after the disaster."
          } >> "$GITHUB_STEP_SUMMARY"
