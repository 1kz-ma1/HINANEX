        id: archive
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_edogawa_demolition_contract.py \
            --out-dir "$RUNNER_TEMP/council-shimokamata-UNAPPROVED"
          python data-research/tools/archive_edogawa_demolition_contract.py \
            --verify-dir "$RUNNER_TEMP/council-shimokamata-UNAPPROVED"

      - name: Checkout pinned C independent source verification
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 5a3ebe73bec01bf8b9caa5386c3fdb387bf8cbfd
          path: c-council-review
          persist-credentials: false

      - name: Install isolated council-PDF page text reader
        shell: bash
        run: python -m pip install 'pymupdf>=1.26,<2'

      - name: Test C rejection of altered bills and hazard conclusions
        shell: bash
        run: |
          python -m unittest discover \
            -s c-council-review/validation/validation \
            -p 'test_edogawa_demolition_contract.py' -v

      - name: Independently audit actual council contract PDF pages and provenance
        id: c_review
        shell: bash
        run: |
          set -euo pipefail
          python c-council-review/validation/validation/verify_edogawa_demolition_contract.py \
            --archive-dir "$RUNNER_TEMP/council-shimokamata-UNAPPROVED" \
            --out "$RUNNER_TEMP/council-shimokamata-UNAPPROVED/C_council_bill_UNAPPROVED.json"

      - name: Save standalone raw official council PDF and C audit without deploying
        if: steps.c_review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-old-campus-demolition-council-UNAPPROVED-${{ github.run_id }}
          path: ${{ runner.temp }}/council-shimokamata-UNAPPROVED/
          if-no-files-found: error
          retention-days: 7

      - name: Document strict difference between council bill and site usage
        if: always()
        shell: bash
        run: |
          {
            echo "### Former Shimokamata municipal council source"
            echo "Official bill archive result: ${{ steps.archive.outcome }}"
            echo "Independent C PDF/page verification: ${{ steps.c_review.outcome }}"
            echo "Separate council vote result page is NOT embedded within the original bill."
            echo "Contract award does not certify demolition completed or current opening."
            echo "C signed campus pairs: 0; new flood CANDIDATE/EXCLUDED: 0."
          } >> "$GITHUB_STEP_SUMMARY"

  council-vote-original:
    name: Archive official 2026 council vote result (NO SITE APPROVAL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned A official council vote original collector
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 8074479eae0d57718a663610f0dd9d2dd7ff414f
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject fake bill votes and premature status promotion
        shell: bash
        run: python -m unittest discover -s data-research/tests -p 'test_archive_edogawa_council_vote.py' -v

      - name: Save official council vote HTML original and source SHA256
        id: a_archive
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_edogawa_council_vote.py \
            --out-dir "$RUNNER_TEMP/edogawa-council-vote-UNAPPROVED"
          python data-research/tools/archive_edogawa_council_vote.py \
            --verify-dir "$RUNNER_TEMP/edogawa-council-vote-UNAPPROVED"

      - name: Checkout pinned C independent council vote verifier
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 4767821e598e7bc5c5707be20bd48356b9b78b33
          path: c-council-vote
          persist-credentials: false

      - name: Run C negative vote attribution and SHA256 tests
        shell: bash
        run: |
          python -m unittest discover \
            -s c-council-vote/validation/validation \
            -p 'test_edogawa_council_vote.py' -v

      - name: Independently inspect original council vote and bill number
        id: c_verification
        shell: bash
        run: |
          set -euo pipefail
          python c-council-vote/validation/validation/verify_edogawa_council_vote.py \
            --archive-dir "$RUNNER_TEMP/edogawa-council-vote-UNAPPROVED" \
            --out "$RUNNER_TEMP/C_council_vote_independent_UNAPPROVED.json"

      - name: Upload source HTML and independent C proof (not demolition progress)
        if: steps.c_verification.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-council-vote-64-source-UNAPPROVED-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/edogawa-council-vote-UNAPPROVED/
            ${{ runner.temp }}/C_council_vote_independent_UNAPPROVED.json
          if-no-files-found: error
          retention-days: 7

      - name: Report strict distinction between council vote and actual use
        if: always()
        shell: bash
        run: |
          {
            echo "### Edogawa Council bill #64 independent voting result"
            echo "A original vote HTML: ${{ steps.a_archive.outcome }}"
            echo "C original-row verification: ${{ steps.c_verification.outcome }}"
            echo "Council approval does NOT prove demolition start/finish."
            echo "C human site pairing 0; D flood status changes 0."
          } >> "$GITHUB_STEP_SUMMARY"

  c-to-b-educational-evidence:
    name: Verify C public Edogawa evidence JSON with B consumer (NO SHELTER)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned C evidence-only source and unsent intake packet
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 3e8cb82f51ddea4bf88dd12eb6221af0c06232a6
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build actual C-public evidence case from UNSENT official-reply packet
        id: c_case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-authority-originals"
          python validation/validation/build_shimokamata_evidence_demo.py \
            --packet validation/reviews/2026-10-13-old-shimokamata-inquiry-packet.json \
            --original-dir "$RUNNER_TEMP/empty-authority-originals" \
            --out "$RUNNER_TEMP/C_shimokamata_public_EVIDENCE_ONLY.json"

      - name: Checkout pinned B educational-only consumer in independent path
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: c15dd60da7aa5757f0fbba513c659b40beac7966
          path: b-educational-consumer
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Independently verify actual C JSON against B fixed original contracts
        shell: bash
        working-directory: b-educational-consumer/frontend
        run: |
          set -euo pipefail
          node scripts/check-c-evidence-case.js "$RUNNER_TEMP/C_shimokamata_public_EVIDENCE_ONLY.json"
          node --test tests/evidence-case-view-model.test.js tests/evidence-case-cli.test.js

      - name: Upload actual C-generated public-only educational case separately
        if: steps.c_case.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: c-to-b-public-educational-shimokamata-UNAPPROVED-${{ github.run_id }}
          path: ${{ runner.temp }}/C_shimokamata_public_EVIDENCE_ONLY.json
          if-no-files-found: error
          retention-days: 7

      - name: Record educational only boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Actual C-to-B source-provenance educational contract'
            echo 'C original-reply packet: NOT_CONTACTED / raw original directory empty.'
            echo 'C source output status: ${{ steps.c_case.outcome }}'
            echo 'No living shelter/route, original re-download, D replay or currently-open site classification.'
            echo 'No municipality human C review, D flood promotion or frontend deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

  b-educational-chromium-smoke:
    name: Chromium actual C-JSON source evidence UI desktop/mobile (NO SHELTER)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned C public educational-only producer
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 3e8cb82f51ddea4bf88dd12eb6221af0c06232a6
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Produce ACTUAL C source-cited educational JSON from unsent template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authority-replies-empty"
          python validation/validation/build_shimokamata_evidence_demo.py \
            --packet validation/reviews/2026-10-13-old-shimokamata-inquiry-packet.json \
            --original-dir "$RUNNER_TEMP/authority-replies-empty" \
            --out "$RUNNER_TEMP/C_public_educational_case.json"

      - name: Checkout pinned B source-only page and browser smoke
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 20f7930ddb1d2fc4c6355e73d20695eae1da5ec2
          path: b-browser
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium for isolated runner only
        shell: bash
        working-directory: b-browser/frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock 'playwright@1.56.1'
          npx playwright install --with-deps chromium

      - name: Browser smoke actual C JSON on desktop and mobile (fail closed)
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory b-browser \
            > "$RUNNER_TEMP/b-static-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/frontend/evidence-case.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/frontend/evidence-case.html >/dev/null
          node b-browser/frontend/scripts/evidence-case-browser-smoke.mjs \
            "$RUNNER_TEMP/C_public_educational_case.json" \
            "$RUNNER_TEMP/evidence-browser-public-screens"

      - name: Archive public-only browser screenshots without deploying UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-educational-chromium-public-screenshots-UNAPPROVED-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-browser-public-screens/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize browser-only educational acceptance
        if: always()
        shell: bash
        run: |
          {
            echo '### B educational evidence browser smoke'
            echo 'Actual pinned C-generated public evidence JSON displayed: ${{ steps.smoke.outcome }}'
            echo 'Checks: Chromium desktop/mobile, three states, official links, keyboard focus, overflow, invalid source clearing, explicit preview reset.'
            echo 'This is local static-page browser smoke, NOT Render staging deployment or real-time shelter evaluation.'
            echo 'Unreviewed and undecided: C human source interpretation, building access, hazard designation and live opening.'
          } >> "$GITHUB_STEP_SUMMARY"

