name: Edogawa official-source evidence capture

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/edogawa-official-source-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    # Independent investigation. Does not deploy or classify any shelter.
    name: Archive and inspect original HTTPS responses (never C approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned C verifier (unmerged evidence tooling)
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 682e635930c5968e29ae7eafe1e322f2b4dcc7a4
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explain evidence and approval boundary
        shell: bash
        run: |
          echo "Source collector revision: $(git rev-parse HEAD)"
          echo "Evidence is UNREVIEWED even if every check succeeds."
          echo "No verified pairs, no flood suitability decision, no writes to main or Render."
          echo "Archives are GitHub Actions artifacts, not Git commits."

      - name: Fetch all seven allowlisted official HTTPS originals
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hinanex-edogawa"
          python validation/validation/archive_edogawa_official_sources.py \
            --out-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed"

      - name: Recheck stored bytes and manifest
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/archive_edogawa_official_sources.py \
            --verify-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed"

      - name: Check that HTTP 200 content is the intended source shape
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/validate_edogawa_official_archive.py \
            --archive-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed" \
            --report "${RUNNER_TEMP}/hinanex-edogawa/content_preflight_unreviewed.json"

      - name: Checkout pinned current-D Edogawa replay code
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 71afebdbf6fe58222af696f760d7f0beda25832f
          path: d-current
          persist-credentials: false

      - name: Install current D pipeline dependencies
        shell: bash
        run: python -m pip install -r d-current/pipeline/requirements.txt

      - name: Replay current D Edogawa RegionExport from exact captured original bytes
        id: d_replay
        working-directory: d-current/pipeline
        shell: bash
        run: |
          set -euo pipefail
          python run_edogawa_evidence_slice.py \
            --archive-dir "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed" \
            --output-dir "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED"

      - name: Attach isolated current D RegionExport (UNREVIEWED)
        if: steps.d_replay.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-current-D-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-edogawa/d-current-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned A research source-hint generator
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 02950c3ce0216254e3cdc3054761caf1efd434ee
          path: a-current
          persist-credentials: false

      - name: Rebuild A unapproved candidate ledger with exact same current D and original sources
        id: a_candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED"
          python a-current/data-research/tools/edogawa_review_ledger.py \
            --water-html "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/water_facilities.html" \
            --location-csv "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/municipal_locations.csv" \
            --region-export "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED/edogawa_current_D_UNREVIEWED.json" \
            --out "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/A_current_D_unapproved.json"

      - name: Independently verify current A to D against exact official originals with C code
        id: c_audit
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/verify_edogawa_water_join.py \
            --water-html "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/water_facilities.html" \
            --location-csv "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/municipal_locations.csv" \
            --region-export "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED/edogawa_current_D_UNREVIEWED.json" \
            --a-ledger "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/A_current_D_unapproved.json" \
            --report "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_independent_current_D_source_consistency.json"

      - name: Generate human-review packet for two schools from the same pinned sources
        id: c_packet
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/build_edogawa_identity_review_packet.py \
            --archive-dir "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed" \
            --c-audit "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_independent_current_D_source_consistency.json" \
            --output "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_two_school_human_review_UNAPPROVED.json"

      - name: Upload exact-current A-D-C trace bundle (NO C human approval)
        if: steps.c_audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-current-A-D-C-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-edogawa/a-c-current-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Attach original responses for independent C review
        if: ${{ always() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-original-bytes-UNREVIEWED-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hinanex-edogawa/raw-unreviewed/
            ${{ runner.temp }}/hinanex-edogawa/content_preflight_unreviewed.json
          if-no-files-found: error
          retention-days: 7

      - name: Record outcome, not approval
        if: always()
        shell: bash
        run: |
          {
            echo "### 江戸川区公式原本取得（独立調査用）"
            echo "取得処理: ${{ steps.capture.outcome }}"
            echo "原本バイトのGit保管や避難適合性の自動分類は行いません。"
            echo "C正式承認ペア数: **0**"
            echo "新規洪水 CANDIDATE/EXCLUDED: **0**"
            echo "資料の対象時期と施設同一性、洪水単独指定の意味は担当者が別途審査します。"
          } >> "${GITHUB_STEP_SUMMARY}"
