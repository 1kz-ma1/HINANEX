name: Edogawa official-source evidence capture

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/edogawa-official-source-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    # Independent investigation. Does not deploy or classify any shelter.
    name: Archive and inspect original HTTPS responses (never C approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned C verifier (unmerged evidence tooling)
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 88e9ae81810244ef4bf100c7d0bd670c626b9f92
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explain evidence and approval boundary
        shell: bash
        run: |
          echo "Source collector revision: $(git rev-parse HEAD)"
          echo "Evidence is UNREVIEWED even if every check succeeds."
          echo "No verified pairs, no flood suitability decision, no writes to main or Render."
          echo "Archives are GitHub Actions artifacts, not Git commits."

      - name: Fetch all seven allowlisted official HTTPS originals
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hinanex-edogawa"
          python validation/validation/archive_edogawa_official_sources.py \
            --out-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed"

      - name: Recheck stored bytes and manifest
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/archive_edogawa_official_sources.py \
            --verify-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed"

      - name: Check that HTTP 200 content is the intended source shape
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/validate_edogawa_official_archive.py \
            --archive-dir "${RUNNER_TEMP}/hinanex-edogawa/raw-unreviewed" \
            --report "${RUNNER_TEMP}/hinanex-edogawa/content_preflight_unreviewed.json"

      - name: Capture two separate Edogawa flood-guidance official originals
        id: guidance
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/archive_edogawa_guidance.py \
            --out-dir "${RUNNER_TEMP}/hinanex-edogawa/guidance-UNREVIEWED"
          python validation/validation/archive_edogawa_guidance.py \
            --verify-dir "${RUNNER_TEMP}/hinanex-edogawa/guidance-UNREVIEWED"

      - name: Attach water-evacuation guidance evidence (not eligibility)
        if: steps.guidance.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-water-guidance-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-edogawa/guidance-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned current-D Edogawa replay code
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 71afebdbf6fe58222af696f760d7f0beda25832f
          path: d-current
          persist-credentials: false

      - name: Install current D pipeline dependencies
        shell: bash
        run: python -m pip install -r d-current/pipeline/requirements.txt

      - name: Replay current D Edogawa RegionExport from exact captured original bytes
        id: d_replay
        working-directory: d-current/pipeline
        shell: bash
        run: |
          set -euo pipefail
          python run_edogawa_evidence_slice.py \
            --archive-dir "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed" \
            --output-dir "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED"

      - name: Attach isolated current D RegionExport (UNREVIEWED)
        if: steps.d_replay.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-current-D-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-edogawa/d-current-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned A research source-hint generator
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 02950c3ce0216254e3cdc3054761caf1efd434ee
          path: a-current
          persist-credentials: false

      - name: Rebuild A unapproved candidate ledger with exact same current D and original sources
        id: a_candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED"
          python a-current/data-research/tools/edogawa_review_ledger.py \
            --water-html "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/water_facilities.html" \
            --location-csv "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/municipal_locations.csv" \
            --region-export "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED/edogawa_current_D_UNREVIEWED.json" \
            --out "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/A_current_D_unapproved.json"

      - name: Independently verify current A to D against exact official originals with C code
        id: c_audit
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/verify_edogawa_water_join.py \
            --water-html "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/water_facilities.html" \
            --location-csv "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed/municipal_locations.csv" \
            --region-export "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED/edogawa_current_D_UNREVIEWED.json" \
            --a-ledger "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/A_current_D_unapproved.json" \
            --report "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_independent_current_D_source_consistency.json"

      - name: Generate human-review packet for two schools from the same pinned sources
        id: c_packet
        shell: bash
        run: |
          set -euo pipefail
          python validation/validation/build_edogawa_identity_review_packet.py \
            --archive-dir "$RUNNER_TEMP/hinanex-edogawa/raw-unreviewed" \
            --c-audit "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_independent_current_D_source_consistency.json" \
            --d-export "$RUNNER_TEMP/hinanex-edogawa/d-current-UNREVIEWED/edogawa_current_D_UNREVIEWED.json" \
            --output "$RUNNER_TEMP/hinanex-edogawa/a-c-current-UNREVIEWED/C_two_school_human_review_UNAPPROVED.json"

      - name: Upload exact-current A-D-C trace bundle (NO C human approval)
        if: steps.c_audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-current-A-D-C-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-edogawa/a-c-current-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Attach original responses for independent C review
        if: ${{ always() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-original-bytes-UNREVIEWED-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hinanex-edogawa/raw-unreviewed/
            ${{ runner.temp }}/hinanex-edogawa/content_preflight_unreviewed.json
          if-no-files-found: error
          retention-days: 7

      - name: Record outcome, not approval
        if: always()
        shell: bash
        run: |
          {
            echo "### 江戸川区公式原本取得（独立調査用）"
            echo "取得処理: ${{ steps.capture.outcome }}"
            echo "原本バイトのGit保管や避難適合性の自動分類は行いません。"
            echo "C正式承認ペア数: **0**"
            echo "新規洪水 CANDIDATE/EXCLUDED: **0**"
            echo "資料の対象時期と施設同一性、洪水単独指定の意味は担当者が別途審査します。"
          } >> "${GITHUB_STEP_SUMMARY}"

  gsi-edogawa:
    name: Investigate official nationwide GSI CSV for Edogawa (NO APPROVAL)
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned A GSI research code
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 1818f32353fbdde102fa217b383bbb97fe31be67
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run A-only GSI offline negative tests
        shell: bash
        run: python -m unittest discover -s data-research/tests -p "test_retrieve_gsi_edogawa_official.py" -v

      - name: Retrieve GSI official nationwide emergency-evacuation CSV
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/retrieve_gsi_edogawa_official.py \
            --out-dir "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED"

      - name: Checkout pinned C independent GSI verifier
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: c5e2a17dcc3e512cef3f4f6431a24caf032224ea
          path: c-current
          persist-credentials: false

      - name: Retrieve exact current D input from the same official-source run
        uses: actions/download-artifact@v4
        with:
          name: edogawa-current-D-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-gsi-D-input

      - name: Retrieve exact C source-to-D audit from the same official-source run
        uses: actions/download-artifact@v4
        with:
          name: edogawa-current-A-D-C-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-gsi-C-input

      - name: Independently audit original GSI rows and current D identity leads
        id: c_crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python c-current/validation/validation/audit_gsi_edogawa_original.py \
            --gsi-raw "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/gsi_national_original_UNREVIEWED.csv" \
            --a-gsi-report "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/gsi_edogawa_review_UNREVIEWED.json" \
            --current-d "$RUNNER_TEMP/hinanex-gsi-D-input/edogawa_current_D_UNREVIEWED.json" \
            --c-source-audit "$RUNNER_TEMP/hinanex-gsi-C-input/C_independent_current_D_source_consistency.json" \
            --out "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/C_gsi_source_to_D_leads_UNAPPROVED.json"

      - name: Download exact municipal-water original bytes from this capture run
        uses: actions/download-artifact@v4
        with:
          name: edogawa-original-bytes-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-water-raw-input

      - name: Checkout pinned A three-source proposal generator
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 7c905935aa7e3929791a4bd0e7650cf988453c48
          path: a-three-source
          persist-credentials: false

      - name: Generate A three-original-review-lead matrix without spatial autojoin
        id: three_a
        shell: bash
        run: |
          set -euo pipefail
          python a-three-source/data-research/tools/edogawa_three_source_review.py \
            --water-html "$RUNNER_TEMP/hinanex-water-raw-input/raw-unreviewed/water_facilities.html" \
            --a-water-ledger "$RUNNER_TEMP/hinanex-gsi-C-input/A_current_D_unapproved.json" \
            --a-gsi-report "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/gsi_edogawa_review_UNREVIEWED.json" \
            --current-d "$RUNNER_TEMP/hinanex-gsi-D-input/edogawa_current_D_UNREVIEWED.json" \
            --out "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/A_water_GSI_D_matrix_UNAPPROVED.json"

      - name: Independently recalculate and verify all three-source A review leads using C
        id: three_c
        shell: bash
        run: |
          set -euo pipefail
          python c-current/validation/validation/verify_edogawa_three_source_review.py \
            --water-html "$RUNNER_TEMP/hinanex-water-raw-input/raw-unreviewed/water_facilities.html" \
            --gsi-national "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/gsi_national_original_UNREVIEWED.csv" \
            --a-water-ledger "$RUNNER_TEMP/hinanex-gsi-C-input/A_current_D_unapproved.json" \
            --a-gsi-report "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/gsi_edogawa_review_UNREVIEWED.json" \
            --current-d "$RUNNER_TEMP/hinanex-gsi-D-input/edogawa_current_D_UNREVIEWED.json" \
            --c-source-audit "$RUNNER_TEMP/hinanex-gsi-C-input/C_independent_current_D_source_consistency.json" \
            --a-matrix "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/A_water_GSI_D_matrix_UNAPPROVED.json" \
            --out "$RUNNER_TEMP/hinanex-gsi-UNREVIEWED/C_three_source_raw_audit_UNAPPROVED.json"

      - name: Archive original GSI CSV plus only research leads, no hazard promotion
        if: steps.three_c.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gsi-national-edogawa-evidence-UNREVIEWED-${{ github.run_id }}
          path: ${{ runner.temp }}/hinanex-gsi-UNREVIEWED/
          if-no-files-found: error
          retention-days: 7

      - name: Record provenance and unresolved meaning
        if: always()
        shell: bash
        run: |
          {
            echo "### GSI nation-wide designated-emergency-evacuation data (A-only)"
            echo "GSI retrieval outcome: ${{ steps.source.outcome }}"
            echo "The source common ID is NOT an existing D facility identifier."
            echo "Municipality flood-only designation does not certify today\x27s opening, safe routes or an Edogawa water-standby site join."
            echo "Human C-approved links: 0 / new flood CANDIDATE/EXCLUDED: 0."
          } >> "$GITHUB_STEP_SUMMARY"

  campus-history:
    name: Archive school campus history and independent C review (NO APPROVAL)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned A campus source-archive code
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: ef11a28ec273f2d47af6dae0d4da926ce958afdc
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run independent A source-capture negative tests
        shell: bash
        run: |
          python -m unittest discover -s data-research/tests -p "test_archive_edogawa_campus_history.py" -v

      - name: Capture version-pinned official school relocation and historical originals
        id: a_history
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_edogawa_campus_history.py \
            --out-dir "$RUNNER_TEMP/edogawa-campus-UNAPPROVED"
          python data-research/tools/archive_edogawa_campus_history.py \
            --verify-dir "$RUNNER_TEMP/edogawa-campus-UNAPPROVED"

      - name: Checkout pinned C independent school-history review code
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: ff0a41d60e8432586f727bd61ac1bf31f8866d86
          path: c-campus-review
          persist-credentials: false

      - name: Run C historical-source independent negative tests
        shell: bash
        run: |
          python -m unittest discover -s c-campus-review/validation/validation -p "test_edogawa_campus_history.py" -v

      - name: Independently verify A raw archive and make unapproved C campus-era packet
        id: c_review
        shell: bash
        run: |
          set -euo pipefail
          python c-campus-review/validation/validation/verify_edogawa_campus_history.py \
            --archive-dir "$RUNNER_TEMP/edogawa-campus-UNAPPROVED" \
            --report "$RUNNER_TEMP/c-campus-timeline-review-UNAPPROVED.json"

      - name: Upload separate school-history originals and human-review candidate packet
        if: steps.c_review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-campus-history-A-C-UNAPPROVED-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/edogawa-campus-UNAPPROVED/
            ${{ runner.temp }}/c-campus-timeline-review-UNAPPROVED.json
          if-no-files-found: error
          retention-days: 7

      - name: Record school-era evidence and remaining review limitations
        if: always()
        shell: bash
        run: |
          {
            echo "### School relocation/merger original archive"
            echo "A original-byte archive result: ${{ steps.a_history.outcome }}"
            echo "C independent source-integrity result: ${{ steps.c_review.outcome }}"
            echo "Historical PDF signatures are NOT manual verification of the PDF pages."
            echo "No school campus/effective-date C human signoff, no D site join."
            echo "No flood-only designation, safe route, opening or exclusion inference."
            echo "C human-approved site pairs: 0 / new flood CANDIDATE/EXCLUDED: 0."
          } >> "$GITHUB_STEP_SUMMARY"

  water-site-revisions:
    name: Archive 2026 external/inland water standby PDF versions (UNAPPROVED)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned A municipal flood-version collector
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: d88e75afb61acf0a2905da679823332aae39668f
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject forged source revisions and premature approvals
        shell: bash
        run: python -m unittest discover -s data-research/tests -p 'test_archive_edogawa_2026_water_site_revisions.py' -v

      - name: Capture new 2026 external/inland disaster-plan and historical school reuse originals
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python data-research/tools/archive_edogawa_2026_water_site_revisions.py \
            --out-dir "$RUNNER_TEMP/edogawa-2026-flood-site-UNAPPROVED"
          python data-research/tools/archive_edogawa_2026_water_site_revisions.py \
            --verify-dir "$RUNNER_TEMP/edogawa-2026-flood-site-UNAPPROVED"

      - name: Checkout pinned independent C 2026 flood-standby review
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 2d4a015e8691d11091a8fa257d0a0571828a627f
          path: c-2026-source
          persist-credentials: false

      - name: Install isolated PDF page text reader for independent C original review
        shell: bash
        run: python -m pip install 'pymupdf>=1.26,<2'

      - name: Reject changed 2026 PDF provenance and false status promotions with C
        shell: bash
        run: |
          python -m unittest discover \
            -s c-2026-source/validation/validation \
            -p 'test_edogawa_2026_water_site_revisions.py' -v

      - name: Independently inspect both dated flood-hazard pages and old-site reuse notice
        id: c_2026
        shell: bash
        run: |
          set -euo pipefail
          python c-2026-source/validation/validation/verify_edogawa_2026_water_site_revisions.py \
            --archive-dir "$RUNNER_TEMP/edogawa-2026-flood-site-UNAPPROVED" \
            --report "$RUNNER_TEMP/edogawa-2026-flood-site-UNAPPROVED/C_independent_site_version_REVIEW_ONLY.json"

      - name: Upload standalone non-approved source revisions
        if: steps.c_2026.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-2026-external-inland-water-originals-UNAPPROVED-${{ github.run_id }}
          path: ${{ runner.temp }}/edogawa-2026-flood-site-UNAPPROVED/
          if-no-files-found: error
          retention-days: 7

      - name: Record no-site-approval boundary
        if: always()
        shell: bash
        run: |
          echo '2026 flood-plan site-version source capture: ${{ steps.source.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original source bytes and as-of dates are not human C approval or real-time site opening.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Old/new Shimokamata must remain physically distinct; 0 C pairs/0 new flood statuses.' >> "$GITHUB_STEP_SUMMARY"

  old-campus-contract:
    name: Archive independent council demolition bill and verify PDF (UNAPPROVED)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned A council official original collector
        uses: actions/checkout@v4
        with:
          repository: 1kz-ma1/HINANEX
          ref: 1505b91e98ab66a308e0af731852eaaf13bb9f8a
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test archive tamper and unsupported approval rejection
        shell: bash
        run: python -m unittest discover -s data-research/tests -p 'test_archive_edogawa_demolition_contract.py' -v

