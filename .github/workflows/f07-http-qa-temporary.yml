name: TEMP QA F07 real HTTP Chromium (do not merge)
"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/f07-http-qa-temporary.yml"
permissions:
  contents: read
jobs:
  f07-real-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact source and run Node offline tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          node gis/prototypes/f07-reference-route/test-node.cjs
      - name: Verify Chromium on actual localhost HTTP assets with untouched CSP
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --version
          timeout 40s env CHROMIUM_BIN="$chrome" node gis/prototypes/f07-reference-route/test-browser.cjs
      - name: Print scope and publication safety constraints
        if: ${{ always() }}
        run: |
          {
            echo "### Temporary F07 safety QA"
            echo "- Exact F07 JS/HTML/CSS from #408 branch with original CSP, local HTTP only."
            echo "- No real locations, no GPS, no external provider, no deployment, no merge of this temporary PR."
            echo "- Browser test checks selection, stale-route purge, NO-GO, widths, local-origin request allowlist."
            echo "- Physical-device QA and Issue #358 publication HOLD remain unresolved."
          } >> "$GITHUB_STEP_SUMMARY"
