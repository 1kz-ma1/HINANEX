name: test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Test PR scope guard
        working-directory: .
        run: python -m unittest discover -s scripts/tests -p "test_pr_scope_guard.py" -v

      - name: Enforce role PR scope
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_pr_scope.py --head-ref "$PR_HEAD_REF" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src *.py

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Test Render staging bundle builder
        working-directory: .
        run: python -m unittest discover -s deploy/tests -v

      - name: Verify committed JSON Schema is in sync
        shell: bash
        run: |
          cp contracts/region_export.schema.json /tmp/region_export.schema.json
          python generate_contract_schema.py
          diff -u /tmp/region_export.schema.json contracts/region_export.schema.json

      - name: Parse branch protection PowerShell scripts
        shell: pwsh
        working-directory: .
        run: |
          $files = @(
            "scripts/setup-main-protection.ps1",
            "scripts/run-main-protection.ps1"
          )
          foreach ($file in $files) {
            $content = Get-Content -Raw -Encoding UTF8 $file
            $null = [scriptblock]::Create($content)
          }
